# GSPO training for the CXR structured-report reward.
# Run:  swift rlhf examples/train/grpo/radiology_gspo.yaml
# (GSPO = GRPO with sequence-level importance sampling: importance_sampling_level: sequence)
#
# The embedding sub-reward is enabled via `reward_embedding_model`. Set it to '' or
# remove it to disable the embedding term (the reward renormalizes over the rest).

# ---- model (set to your SFT VLM checkpoint) ----
model: /cache/fast_data_nas71/janhavi/VLM_qure/vlm/swift/vlm_ckpts/0909_qwen3_5_4b_ct_zero2/v2-20260910-112625/checkpoint-14000
torch_dtype: bfloat16
tuner_type: full

# ---- reward ----
rlhf_type: grpo
external_plugins:
  - examples/train/grpo/plugin/radiology_reward.py
reward_funcs:
  - radiology              # task router: dispatches per-row on the `task` column
# fine-tuned radiology embedding encoder used by the embedding sub-reward:
reward_embedding_model: /cache/fast_data_nas71/janhavi/vlm_ckpts/qwen3_4b_embedding/31_aug_qwen3_4b_size_lat_asp_findings_perturbation_focus_v1/checkpoints/checkpoint-7000
scale_rewards: group          # sub-rewards are already in [0,1]; group-standardize advantages

# ---- data: mix any subset of the seven task parquets; the router scores each by `task` ----
dataset:
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/ontology.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/cls_json.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/cls_tokens.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/asp.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/bbox.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/kgraph.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/comparison.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/training/compound.parquet   # multi-task rollouts ("x,ontology")
split_dataset_ratio: 0.0
max_length: 8192

# ---- GSPO core ----
importance_sampling_level: sequence
beta: 0.0
epsilon: 3e-4
epsilon_high: 4e-4
num_generations: 16
steps_per_generation: 16
num_iterations: 1
# exploration / anti-collapse (keeps rollout diversity for consensus-style signals)
dynamic_sample: true
max_resample_times: 3

# ---- rollout backend ----
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.5
vllm_max_model_len: 8192
max_completion_length: 2048
temperature: 1.0
top_p: 0.9

# ---- optimization ----
num_train_epochs: 1
per_device_train_batch_size: 2
gradient_accumulation_steps: 8
learning_rate: 1e-6
warmup_ratio: 0.05
deepspeed: zero3
offload_optimizer: true
offload_model: true
sleep_level: 1

# ---- logging / io ----
output_dir: /cache/fast_data_nas71/janhavi/data/rl_training/output/radiology_gspo
save_steps: 200
save_total_limit: 3
logging_steps: 5
log_completions: true
dataloader_num_workers: 4
