# Experiment-1 GSPO curriculum RL (24_sep) for the CXR structured-report reward.
#   tsh ssh janhavi.prabhu@qure5.internal.qure.ai \
#     'cd /cache/fast_data_nas71/janhavi/data/rl_training && sbatch rl_exp1_24sep.sbatch'
#
# WHAT CHANGED vs radiology_gspo_curriculum.yaml:
#   * reward_embedding_model -> 23_sep cross-axis checkpoint-900 (was 15_sep / 18_sep).
#   * dataset -> exp1_{easy,medium,hard} (consolidated cls_json->report + cls_tokens->report,
#     + standalone asp + kgraph; safety_score>=0.8; ~12% normals). Built by build_exp1_data.py.
#   * constrained-RL reward terms (recall/precision constraints, weighted-Brier calibration,
#     A_attr attribute agreement, beta*safety embedding reliability) are switched ON via the
#     RADREWARD_* env vars in rl_exp1_24sep.sbatch -- backwards-compatible defaults keep them off.
#
# CURRICULUM: the three dataset parquets are difficulty stages (easy->medium->hard). With
# dataset_shuffle:false swift consumes them in listed order (GRPO RepeatSampler shuffle=false).

# ---- model: SFT VLM checkpoint -----------------------------------------------------------------
# Qwen3.5-2B stage6b (tool-calling) SFT, checkpoint-608. Plain 2D (no vision_3d_config), template
# qwen3_5 native. The reward's boolean-token calibration reads THIS tokenizer (|<ASP>| etc.).
model: /cache/fast_data_nas71/janhavi/VLM_qure/vlm/swift/vlm_ckpts/Qwen3.5-2B_stage6b_alltools/v0-20260906-173237/checkpoint-608
torch_dtype: bfloat16
tuner_type: full
attn_impl: sdpa               # flash_attn not installed in swift_infer
template: qwen3_5             # Qwen3.5 (v3, patch16)

# ---- reward ------------------------------------------------------------------------------------
rlhf_type: grpo
external_plugins:
  - examples/train/grpo/plugin/radiology_reward.py
reward_funcs:
  - radiology                 # task router: dispatches per-row on the `task` column
# 23_sep cross-axis embedding encoder (checkpoint-900) used by the embedding sub-reward + A_attr:
reward_embedding_model: /cache/fast_data_nas71/janhavi/vlm_ckpts/qwen3_4b_embedding/23_sep_qwen3_4b_cross_axis_v1/checkpoints/checkpoint-900
scale_rewards: group          # sub-rewards are already in [0,1]; group-standardize advantages

# ---- data: exp1 curriculum stages, consumed IN ORDER (do not shuffle) --------------------------
# Each row carries safety_score (GT completeness) + n_present_tags. The reward scales the embedding
# sub-reward by beta(n_present)*safety so complete GT trusts the embedding, sparse GT leans on the
# verifiable terms (cls/FP, recall/precision, calibration, atoms).
dataset:
  # REORDERED + DOWNSAMPLED curriculum (build_exp1_downsampled.py). Full 28k-row epoch took ~10d at
  # ~131s/step on L40S vs a 5d wall -> only ~47% covered and the standalone cls (which fix cls collapse)
  # never reached. These _ds stages (a) MERGE each standalone-cls tier INTO its difficulty stage so it is
  # no longer stranded at the end, and (b) DOWNSAMPLE each task to 35%/tier so a FULL epoch fits the wall
  # (~10,482 rows -> ~2,620 steps -> ~4.0d L40S / ~1.7d 4xH100). kgraph kept whole (scarcest task).
  - /cache/fast_data_nas71/janhavi/data/rl_training/exp1/exp1_easy_ds.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/exp1/exp1_medium_ds.parquet
  - /cache/fast_data_nas71/janhavi/data/rl_training/exp1/exp1_hard_ds.parquet
dataset_shuffle: false        # KEY: preserve easy->medium->hard order (tasks are interleaved WITHIN each stage)
split_dataset_ratio: 0.0
max_length: 8192

# ---- GSPO core ---------------------------------------------------------------------------------
importance_sampling_level: sequence
log_rollout_offpolicy_metrics: true   # compute+attach rollout logprobs -> reward kwargs so the Brier calibration term can fire
beta: 0.0
epsilon: 3e-4
epsilon_high: 4e-4
num_generations: 16
steps_per_generation: 16   # back to 24_sep value (pdbs 2 * world 4 * 16 = 128 generation batch)
num_iterations: 1
dynamic_sample: true
max_resample_times: 3

# ---- rollout backend (from-source vLLM 0.26.0+cu128 in swift_infer, colocate) ------------------
use_vllm: true
vllm_mode: colocate
vllm_gpu_memory_utilization: 0.2   # L40S: small KV pool (4B embedder + zero2_offload resident)
                                   # GPU (~8GB), so vLLM's sleep/wake KV re-map OOM'd at 0.5 on L40S 48GB
vllm_enforce_eager: true
vllm_max_model_len: 8192
vllm_limit_mm_per_prompt: '{"image": 1}'
sleep_level: 1
max_completion_length: 2048   # ASP (the ~4-6k-tok tail that forced 3072) is now a RESERVED standalone
                              # task and dropped from the curriculum. Longest remaining real completion
                              # is ~800 tok (kgraph) / ~650 (cls_json,ontology), so 2048 clears every
                              # legitimate output with margin and only clips runaway repetition.
temperature: 1.0
top_p: 0.9
top_k: 20

# ---- optimization ------------------------------------------------------------------------------
num_train_epochs: 1
per_device_train_batch_size: 2   # back to 24_sep value: at 2048 (no ASP) this is proven to fit L40S;
gradient_accumulation_steps: 8   # bs=1 was only needed to absorb 3072-tok completions. Effective batch
                                 # unchanged (2*8 == 1*16 == 64); faster per step (fewer micro-steps).
learning_rate: 1e-6
warmup_ratio: 0.05
deepspeed: zero2_offload   # zero2 + optimizer->CPU offload: frees GPU so 2B-train + 4B embedder + vLLM fit L40S
gradient_checkpointing: true   # cut activation memory (2048-tok completions + vision tokens)

# ---- logging / io ------------------------------------------------------------------------------
output_dir: /mnt/scratch/janhavi/rl_ckpts/exp1_1oct   # CephFS scratch (shared across nodes, fast; avoids nas71)
run_name: exp1_1oct_gspo_cxr
save_steps: 200
save_total_limit: 3
logging_steps: 5
log_completions: true
report_to:
  - tensorboard
  - wandb
dataloader_num_workers: 4
